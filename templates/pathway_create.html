{% extends "base.html" %}

{% block content %}
<div class="detail-header">
    <h2>Create Pathway</h2>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
</div>

<div class="card">
    <form method="post" action="{{ url_for('pathway_create') }}">
        {% if domain %}
        <input type="hidden" name="domain_id" value="{{ domain.id }}">
        <div class="form-group">
            <label>Information Domain</label>
            <p class="form-static">{{ domain.name }}</p>
        </div>
        {% else %}
        <div class="form-group">
            <label for="domain_id">Information Domain</label>
            <select id="domain_id" name="domain_id" class="form-control" required>
                {% for d in active_domains %}
                <option value="{{ d.id }}" {% if domain and domain.id == d.id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <div class="form-group">
            <label for="name">Pathway Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="purpose">Purpose</label>
            <textarea id="purpose" name="purpose" rows="3"></textarea>
        </div>

        <div class="form-group">
            <label for="intended_audience">Intended Audience</label>
            <input type="text" id="intended_audience" name="intended_audience">
        </div>

        <div class="form-group">
            <label for="desired_proficiency_outcome">Desired Proficiency Outcome</label>
            <textarea id="desired_proficiency_outcome" name="desired_proficiency_outcome" rows="4"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Create Pathway</button>
    </form>
</div>
{% endblock %}
